# EMC controller parameters for a simulated machine.

# General note: Comments can either be preceded with a # or ; - either is
# acceptable, although # is in keeping with most linux config files.

# General section -------------------------------------------------------------
[EMC]

# Version of this INI file
VERSION = 1.1

# Name of machine, for use with display, etc.
# MACHINE = LinuxCNC-ASDA-B3-E
MACHINE = Asio Otus


# Debug level, 0 means no messages, 0x7FFFFFFF is debug all. See src/emc/nml_int/emcglb.h for others
# DEBUG = 0x7FFFFFFF 
DEBUG = 0

[DISPLAY]

# LOG_FILE = logtest.log

# Name of display program, e.g., axis
# DISPLAY = axis
DISPLAY = qtvcp qtdragon_hd
PREFERENCE_FILE_PATH = WORKINGFOLDER/qtdragon.pref
MDI_HISTORY_FILE = mdi_history.dat
MACHINE_LOG_PATH = machine_log.dat
LOG_FILE = qtdragon.log

# MAY BE IN WRONG SECTION
# The path start point for all remap searches, i.e. Python's sys.path.append()
PATH_APPEND = ~/linuxcnc/nc_files/remap_lib/python-stdglue/python
# path to the tremap's 'toplevel file
TOPLEVEL = ~/linuxcnc/nc_files/remap_lib/python-stdglue/python/toplevel.py

# EMBED_TAB_NAME = Vismach demo
# EMBED_TAB_COMMAND = qtvcp vismach_mill_xyz
# EMBED_TAB_LOCATION = tabWidget_utilities

# stores last used spindle speed in a given session
# USER_COMMAND_FILE = CONFIGFOLDER/spindle_default_speed.py

# Cycle time, in seconds, that display will sleep between polls
CYCLE_TIME = 0.100

# Path to help file
HELP_FILE = doc/help.txt

# Initial display setting for position, RELATIVE or MACHINE
POSITION_OFFSET = RELATIVE

# Initial display setting for position, COMMANDED or ACTUAL
POSITION_FEEDBACK = ACTUAL

# Highest value that will be allowed for feed override, 1.0 = 100%
# MAX_FEED_OVERRIDE = 2.0
# MAX_SPINDLE_OVERRIDE = 2.0

MAX_SPINDLE_0_OVERRIDE = 2.0
MIN_SPINDLE_0_OVERRIDE = 0.0
MAX_FEED_OVERRIDE      = 2.0


DEFAULT_SPINDLE_0_SPEED = 5000
SPINDLE_INCREMENT = 100
MIN_SPINDLE_0_SPEED = 100
MAX_SPINDLE_0_SPEED = 9500
MAX_SPINDLE_POWER = 3700



INCREMENTS = Continuous, .01 mm, .1 mm, 1 mm, 1.0 inch, 0.1 inch, 0.01 inch, 0.001 inch, 0.0001 inch
ANGULAR_INCREMENTS = 1, 5, 10, 30, 45, 90, 180, 360

MIN_LINEAR_VELOCITY     = 0
MAX_LINEAR_VELOCITY     = 5.00
DEFAULT_LINEAR_VELOCITY = 2.0
DEFAULT_ANGULAR_VELOCITY = 10
MIN_ANGULAR_VELOCITY = 1
MAX_ANGULAR_VELOCITY = 360

# Prefix to be used
PROGRAM_PREFIX = ~/linuxcnc/configs/nc_files/

# Introductory graphic
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 10

#EDITOR = gedit
TOOL_EDITOR = tooledit Z DIAM
# GRIDS = 1 in, 0.1 in, 10 mm, 1 mm
# INCREMENTS = 0.1 in, 10 mil, 1 mil, 1 mm, 0.1 mm, 0.01 mm 
# [TRY UNCOMMENTING THE ABOVE!]

[PROBE]
USE_PROBE = versaprobe
# USE_PROBE = basicprobe

[FILTER]
PROGRAM_EXTENSION = .png,.gif,.jpg Grayscale Depth Image
PROGRAM_EXTENSION = .py Python Script

png = image-to-gcode
gif = image-to-gcode
jpg = image-to-gcode
py = python

[RS274NGC]
# PARAMETER_FILE = sim.var
RS274NGC_STARTUP_CODE = G17 G20 G40 G43H0 G54 G64P0.0005 G80 G90 G94 G97 M5 M9

# Adjust this paths to point to folders with stdglue.py, qt_auto_tool_probe.ngc and on_abort.ngc
# or similarly coded custom remap files.
SUBROUTINE_PATH = ~/linuxcnc/nc_files/examples/remap-subroutines:\
# SUBROUTINE_PATH = ~/linuxcnc/nc_files/remap_lib

# is the sub, with is called when a error during tool change happens.
ON_ABORT_COMMAND=O <on_abort> call

# The remap code for QtVCP's versaprobe's automatic tool probe of Z
REMAP=M6  modalgroup=6 prolog=change_prolog ngc=qt_auto_probe_tool epilog=change_epilog



[MDI_COMMAND_LIST]
# for macro buttons
# MDI_COMMAND = G0 Z25;X0 Y0;Z0, Goto\nUser\nZero
MDI_COMMAND = G53 G0 Z0;G53 G0 X0 Y0,Goto\nMachn\nZero

[EMCMOT]

EMCMOT = motmod

# Timeout for comm to emcmot, in seconds
COMM_TIMEOUT = 1.0

# BASE_PERIOD is unused in this configuration but specified in core_sim.hal
BASE_PERIOD = 0
# Servo task period, in nano-seconds
SERVO_PERIOD = 1000000

# Task controller section -----------------------------------------------------
[TASK]

# Name of task controller program, e.g., milltask
TASK = milltask

# Cycle time, in seconds, that task controller will sleep between polls
CYCLE_TIME = 0.001

[HAL]
HALUI = halui
HALFILE = ethercat-test.hal
POSTGUI_HALFILE = qtdragon_hd_postgui.hal

[EMCIO]

# Name of IO controller program, e.g., io
EMCIO = io

# cycle time, in seconds
CYCLE_TIME = 0.100

# tool table file
TOOL_TABLE = ToolLibrary.tbl
TOOL_CHANGE_POSITION = 14.15 8 -.6
TOOL_CHANGE_QUILL_UP = 1

[VERSA_TOOLSETTER]
X = 14.2
Y = 8
Z = -.6
Z_MAX_CLEAR = -.6
MAXPROBE =  -20

[CHANGE_POSITION]
X = 14.2
Y = 8
Z = -.6

[TRAJ]
SPINDLES = 1
COORDINATES = X Y Z
LINEAR_UNITS = inch
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 2
MAX_LINEAR_VELOCITY = 5
DEFAULT_LINEAR_ACCELERATION = 100
MAX_LINEAR_ACCELERATION = 100
# POSITION_FILE = position.txt
# below are defaults
ARC_BLEND_ENABLE = 1
ARC_BLEND_FALLBACK_ENABLE = 0
ARC_BLEND_OPTIMIZATION_DEPTH = 50
ARC_BLEND_GAP_CYCLES = 4
ARC_BLEND_RAMP_FREQ = 100


[SPINDLE_0]
MAX_FORWARD_VELOCITY = 10000
MIN_FORWARD_VELOCITY = 10
INCREMENT = 10


[KINS]
KINEMATICS = trivkins
JOINTS = 3

[AXIS_X]
MIN_LIMIT = -0.0
MAX_LIMIT = 14.25
MAX_VELOCITY = 5
MAX_ACCELERATION = 100

[JOINT_0]
TYPE = LINEAR
# ENCODER_SCALE = 127000
# OUTPUT_SCALE = .2
FERROR = 2
MIN_FERROR = 1
MAX_VELOCITY = 5
MAX_ACCELERATION = 100
BACKLASH = 0.0000
MIN_LIMIT = -0.0
MAX_LIMIT = 14.25
HOME_SEARCH_VEL = 1.0
HOME_LATCH_VEL = -1.0
# Change home sequence below to 0 or 1 to jog without homing
HOME_SEQUENCE = -1
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
# HOME_OFFSET = 14
# HOME = 13
# --- The below 3 lines are for homing by retrieving absolute positon from the encoder.
HOME_OFFSET = 0
HOME = 0
HOME_ABSOLUTE_ENCODER = 2

[AXIS_Y]
MIN_LIMIT = -0.0
MAX_LIMIT = 8.375
MAX_VELOCITY = 5
MAX_ACCELERATION = 100

[JOINT_1]
TYPE = LINEAR
FERROR = 2
MIN_FERROR = 1
MAX_VELOCITY = 5
MAX_ACCELERATION = 100
BACKLASH = 0.0000
MIN_LIMIT = -0.0
MAX_LIMIT = 8.375
HOME_SEARCH_VEL = 1.0
HOME_LATCH_VEL = -1.0
# Change home sequence below to 0 or 1 to jog without homing
HOME_SEQUENCE = -1
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
# HOME_OFFSET = 14
# HOME = 13
# --- The below 3 lines are for homing by retrieving absolute positon from the encoder.
HOME_OFFSET = 0
HOME = 0
HOME_ABSOLUTE_ENCODER = 2

[AXIS_Z]
MIN_LIMIT = -14.75
MAX_LIMIT = -.5
MAX_VELOCITY = 5
MAX_ACCELERATION = 100
OFFSET_AV_RATIO  = 0.2

[JOINT_2]
TYPE = LINEAR
FERROR = 2
MIN_FERROR = 1
MAX_VELOCITY = 5
MAX_ACCELERATION = 100
BACKLASH = 0.0000
MIN_LIMIT = -14.75
MAX_LIMIT = -.5
HOME_SEARCH_VEL = 1.0
HOME_LATCH_VEL = -1.0
# Change home sequence below to 0 or 1 to jog without homing
HOME_SEQUENCE = -1
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
# HOME_OFFSET = 14
# HOME = 13
# --- The below 3 lines are for homing by retrieving absolute positon from the encoder.
HOME_OFFSET = 0
HOME = 0
HOME_ABSOLUTE_ENCODER = 2
